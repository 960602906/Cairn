appId: com.cairn.desktop
productName: Cairn
copyright: Copyright © 2026 Cairn contributors

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.test.*'
  # 这些排除项只针对 staging 根目录。写成 `**/src/**` 会把依赖包的运行时源码
  # （例如 koffi 的 `src/koffi/index.js`）一起删掉，导致安装后加载原生模块失败。
  - '!src/**'
  - '!e2e/**'
  - '!spikes/**'

asar: true
asarUnpack:
  - out/bin/**/*
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
  - node_modules/better-sqlite3/**/*

extraResources:
  - from: resources/skills
    to: skills

# 运行时依赖由 staging 的 package.json 提供。所依赖的原生模块基于 Node-API 预编译，
# 不再调用 node-gyp，避免构建机需要 Visual Studio/C++ 工具链。
npmRebuild: false

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # 界面入口使用本地 file:// 资源；关闭该 fuse 会让 Chromium 拒绝加载 asar 内的页面。
  # asar 完整性与 onlyLoadAppFromAsar 仍然开启，见 ADR-0035。
  grantFileProtocolExtraPrivileges: true

win:
  icon: build/icons/icon.ico
  extraResources:
    # 随包 MinGit（M5-03）：由 `pnpm fetch:mingit` 生成，不提交到仓库。
    # macOS / Linux 使用系统 Git（ADR-0008），不带这份资源。
    - from: resources/git
      to: git
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  # 保留图标、版本资源与清单编辑，只跳过代码签名。正式签名在 M5-08 的 release workflow 中开启。
  signExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: Cairn-${version}-${arch}-setup.${ext}

mac:
  icon: build/icons/icon.icns
  category: public.app-category.developer-tools
  # DMG 与 ZIP 都使用同一命名规则；ZIP 的默认名会带 `-mac` 后缀，与发布脚本和更新元数据不一致。
  artifactName: Cairn-${version}-${arch}.${ext}
  # 分架构构建：Apple Silicon 与 Intel 各自一个 DMG / ZIP（更新用）。
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # 未签名构建：本地与普通 PR 产出 unsigned 包，M6-02 的签名/公证在发布流水线开启。
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 公证默认关闭，由 macSigningBuilderArgs() 在凭据齐全时打开。
  notarize: false

dmg:
  artifactName: Cairn-${version}-${arch}.${ext}
  title: ${productName} ${version}
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

linux:
  icon: build/icons/icon.png
  category: Development
  executableName: cairn
  synopsis: Local-first desktop AI coding agent
  # 只发布 x64；AppImage 用于免安装运行与自动更新，deb 用于系统集成与卸载。
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # Linux 目标的 `${arch}` 会被展开成发行版惯用名（AppImage 为 x86_64、deb 为 amd64），
  # 与发布脚本、校验和与更新元数据约定的 `x64` 不一致；因此各目标显式写死命名。
  artifactName: Cairn-${version}-x64.${ext}
  maintainer: Cairn contributors <960602906@qq.com>

appImage:
  artifactName: Cairn-${version}-x64.${ext}

deb:
  artifactName: Cairn-${version}-x64.${ext}
  # electron-builder 的默认依赖已含 libsecret-1-0（凭据存储）、libnss3 等运行库；
  # 这里显式声明，避免以后默认值变化时静默丢依赖。
  depends:
    - default

# 普通打包使用 --publish never，app-update.yml 由 afterPack 按构建时的 CAIRN_UPDATE_URL 写入：
# 静态目录写成 generic，`https://github.com/<owner>/<repo>` 写成 github（公开仓库 Releases）。
# 这里的占位源只用于没有注入更新源的本地打包。
publish:
  provider: generic
  url: https://updates.invalid/cairn/
