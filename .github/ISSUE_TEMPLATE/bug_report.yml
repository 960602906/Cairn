name: Bug report / 缺陷报告
description: Something does not work as documented / 行为与文档不符
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **remove API keys, tokens, personal paths and private
        source code** from logs and screenshots before submitting.

        感谢反馈。提交前请从日志与截图中**删除 API Key、令牌、个人路径与私有代码**。
        Security vulnerabilities must not be reported here — see
        [SECURITY.md](../../SECURITY.md). 安全问题请勿在此报告。

  - type: textarea
    id: summary
    attributes:
      label: What happened / 发生了什么
      description: A clear description of the bug. / 简明描述问题。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open ...
        2. Send ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cairn version / 版本
      description: Shown in Settings → About, or the installer file name. / 设置 → 关于，或安装包文件名。
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and architecture / 系统与架构
      placeholder: Windows 11 24H2 x64
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Model provider and model / 模型供应商与模型
      description: Provider type (Anthropic/OpenAI/Gemini-compatible) and model id. Do not paste keys.
      placeholder: OpenAI-compatible, deepseek-chat
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 诊断信息
      description: |
        Settings → Diagnostics can export a redacted report. Attach it or paste the relevant part.
        设置 → 诊断可导出脱敏报告。请检查其中没有敏感信息后再附上。
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs / 截图或日志
      description: Drag and drop if helpful. / 如有帮助可拖放上传。
    validations:
      required: false
