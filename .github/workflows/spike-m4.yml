name: Spike M4

# M4-00 预研：同一宿主多运行（S1）、隔离工作区（S2）、通知策略（S3）、
# 进程树清理（S4）。只运行 spikes/m4，不进入产品覆盖率。
on:
  pull_request:
    paths:
      - 'spikes/m4/**'
      - 'packages/checkpoint/**'
      - 'packages/runtime-pi/**'
      - 'packages/shell/**'
      - '.github/workflows/spike-m4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-m4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spikes:
    name: s1-s4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run M4 spikes
        run: pnpm spike:m4
