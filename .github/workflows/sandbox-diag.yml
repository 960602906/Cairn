# 临时诊断（验证完即删）
name: sandbox-diag
on:
  push:
    branches: [claude/project-thread-0n60yn]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Diag (pwsh)
        continue-on-error: true
        run: pnpm exec vitest run packages/shell/src/sandbox/desktop.diag.test.ts
        env:
          CAIRN_SANDBOX_DIAG: '1'
      - name: Diag (bash)
        continue-on-error: true
        shell: bash
        run: pnpm exec vitest run packages/shell/src/sandbox/desktop.diag.test.ts
        env:
          CAIRN_SANDBOX_DIAG: '1'
