name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows 是首发平台，必须通过（架构 §18）。
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # GitHub Releases 的 Electron 资产偶发 504；镜像对两端平台都可用。
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check app version (single source)
        run: pnpm check:version

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test (coverage ≥ 95%)
        run: pnpm test:coverage

      # 检查点性能验收单独运行：与其他测试同时运行会拖慢用到 Git 的测试
      - name: Checkpoint performance
        run: pnpm test:perf
        env:
          CAIRN_PERF: '1'

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check i18n keys (ADR-0013)
        run: pnpm check:i18n

      - name: Build desktop app
        run: pnpm build

      # 用构建产物启动应用：窗口加载、界面渲染、agent 宿主启动、数据目录创建（M0-12a）
      - name: Smoke test desktop app
        run: pnpm smoke

      # Playwright 启动构建产物（M0-16）。Linux 无头模式下窗口只有 1×1，用 Xvfb 提供显示器
      - name: E2E test desktop app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pnpm e2e; else pnpm e2e; fi

      # Windows 是首发平台：解包产物必须可验证、可启动，并通过真实打包程序的 e2e（M5-02）。
      # NSIS 安装包只在 release workflow 构建，普通 PR 不下载/执行安装器。
      - name: Cache MinGit archive
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: .cache/mingit
          key: mingit-2.56.0.4-${{ runner.os }}

      - name: Fetch bundled MinGit
        if: matrix.os == 'windows-latest'
        run: pnpm fetch:mingit

      - name: Package desktop app
        if: matrix.os == 'windows-latest'
        run: pnpm package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged application
        if: matrix.os == 'windows-latest'
        run: pnpm package:verify

      - name: Smoke test packaged application
        if: matrix.os == 'windows-latest'
        run: pnpm smoke:packaged

      # 临时诊断（验证完即删）：对比不同启动外壳与临时目录形式下，打包应用沙箱的表现
      - name: DIAG env under pwsh
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: |
          "TEMP=$env:TEMP"; "TMP=$env:TMP"
          node -e "console.log('tmpdir', require('os').tmpdir()); console.log(Object.keys(process.env).sort().join(' '))"
          whoami /groups | Select-String -Pattern 'Label|S-1-5-5|Administrators'
          icacls $env:TEMP

      - name: DIAG env under bash
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        run: |
          echo "TEMP=$TEMP TMP=$TMP"
          node -e "console.log('tmpdir', require('os').tmpdir()); console.log(Object.keys(process.env).sort().join(' '))"

      - name: DIAG packaged e2e under bash
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        run: pnpm e2e:packaged

      - name: DIAG packaged e2e under pwsh with long TEMP
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: |
          $long = (Get-Item -LiteralPath $env:TEMP).FullName
          "long=$long"
          $env:TEMP = $long; $env:TMP = $long
          pnpm e2e:packaged

      - name: E2E test packaged application
        if: matrix.os == 'windows-latest'
        run: pnpm e2e:packaged

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
            apps/desktop/playwright-report-packaged/
            apps/desktop/test-results-packaged/
          retention-days: 14

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check dependency licenses (ADR-0014)
        run: pnpm check:licenses
