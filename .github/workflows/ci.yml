name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows 是首发平台，必须通过（架构 §18）。
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test (coverage ≥ 95%)
        run: pnpm test:coverage

      # 检查点性能验收单独运行：与其他测试同时运行会拖慢用到 Git 的测试
      - name: Checkpoint performance
        run: pnpm test:perf
        env:
          CAIRN_PERF: '1'

      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Check i18n keys (ADR-0013)
        run: pnpm check:i18n

      - name: Build desktop app
        run: pnpm build

      # 用构建产物启动应用：窗口加载、界面渲染、agent 宿主启动、数据目录创建（M0-12a）
      - name: Smoke test desktop app
        run: pnpm smoke

      # Playwright 启动构建产物（M0-16）。Linux 无头模式下窗口只有 1×1，用 Xvfb 提供显示器
      - name: E2E test desktop app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a pnpm e2e; else pnpm e2e; fi

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 14

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check dependency licenses (ADR-0014)
        run: pnpm check:licenses
